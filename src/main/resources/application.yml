spring:
  profiles:
    active: dev
  
  # Configurações do Spring Boot Scheduler
  task:
    scheduling:
      thread-name-prefix: "ifmeetup-scheduler-"
      pool:
        size: 3
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25
        keep-alive: "60s"

# Configurações da integração SUAP
suap:
  api:
    base-url: https://suap.ifpb.edu.br/api
    timeout:
      connect: 5000  # 5 segundos
      read: 15000    # 15 segundos
    retry:
      max-attempts: 3
      delay: 1000    # 1 segundo
  integration:
    enabled: true

# Configurações OpenFeign
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000
        loggerLevel: basic
        retryer:
          period: 1000
          maxPeriod: 2000
          maxAttempts: 3
      suap-auth-client:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
      suap-data-client:
        connectTimeout: 5000
        readTimeout: 15000
        loggerLevel: basic
  httpclient:
    hc5:
      enabled: true
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Configurações customizadas para tarefas agendadas
ifmeetup:
  scheduler:
    # Habilitar/desabilitar tarefas agendadas
    enabled: true
    # Configurações específicas das tarefas
    tasks:
      # Marcar eventos como concluídos
      mark-expired-events:
        enabled: true
        cron: "0 */30 * * * *"  # A cada 30 minutos
      # Marcar eventos como em progresso  
      mark-in-progress-events:
        enabled: true
        cron: "0 0 2 * * *"     # Todos os dias às 02:00
      # Tarefas de manutenção semanal
      weekly-maintenance:
        enabled: true
        cron: "0 0 3 * * SUN"   # Domingos às 03:00