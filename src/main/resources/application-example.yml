server:
  port: 8080

spring:
  application:
    name: ifmeetup

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/ifmeetup
    username: your_username
    password: your_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

  # Email
  mail:
    host: smtp.example.com
    port: 587
    username: your_email@example.com
    password: your_email_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Web configurations
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

  # Security configurations
  security:
    jwt:
      secret: your_jwt_secret_key_here
      expiration: 86400000
      remember-me-expiration: 2592000000

# Logging
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    br.edu.ifpb.ifmeetup: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: br.edu.ifpb.ifmeetup.controller
  show-actuator: true

# Application configuration
application:
  url: http://localhost:8080

# Configurações da integração SUAP (exemplo)
suap:
  api:
    base-url: https://suap.ifpb.edu.br/api
    timeout:
      connect: 5000  # 5 segundos
      read: 15000    # 15 segundos
    retry:
      max-attempts: 3
      delay: 1000    # 1 segundo
  integration:
    enabled: true  # Feature flag para habilitar/desabilitar integração
    sync-interval: PT24H  # Intervalo de sincronização (formato ISO-8601)
  security:
    validation:
      matricula-pattern: "^\\d{7,12}$"  # Padrão de validação de matrícula
      token-validation-enabled: true

# Configurações OpenFeign (exemplo)
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000
        loggerLevel: basic
      suap-auth-client:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
      suap-data-client:
        connectTimeout: 5000
        readTimeout: 15000
        loggerLevel: basic
  httpclient:
    hc5:
      enabled: true