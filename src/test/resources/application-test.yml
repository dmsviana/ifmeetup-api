spring:
  # Configurações do Banco de Dados para Testes (H2 em memória)
  datasource:
    url: jdbc:h2:mem:ifmeetuptestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Cria o schema ao iniciar e apaga ao finalizar os testes
    show-sql: true # Mostra o SQL gerado no console (útil para debug)
    properties:
      hibernate:
        format_sql: true
  # Configuração para o H2 Console (opcional, mas útil para inspecionar o banco durante os testes)
  h2:
    console:
      enabled: true
      path: /h2-console # Acessível em http://localhost:<porta_teste>/h2-console
      settings:
        trace: false
        web-allow-others: false
  # Configurações de segurança para testes
  security:
    jwt:
      secret: test-secret-key-for-jwt-token-generation-in-tests-environment-only
      expiration: 3600000
  # Configurações de email para testes (mock)
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Configurações específicas da integração SUAP para testes
suap:
  api:
    base-url: http://localhost:8089  # WireMock server para testes
    timeout:
      connect: 2000  # Timeouts menores para testes
      read: 5000
    retry:
      max-attempts: 1  # Sem retry em testes para falhar rápido
      delay: 100
  integration:
    enabled: true
    sync-interval: PT1M  # Sincronização mais frequente para testes
  security:
    validation:
      matricula-pattern: "^\\d{7,12}$"
      token-validation-enabled: true

# Configurações OpenFeign para testes
feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: full  # Log completo para debug em testes
        retryer:
          period: 100
          maxPeriod: 200
          maxAttempts: 1
      suap-auth-client:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: full
      suap-data-client:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: full
  httpclient:
    hc5:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE # Para ver os parâmetros das queries
    br.edu.ifpb.ifmeetup: DEBUG
    # Logs específicos da integração SUAP para testes
    br.edu.ifpb.ifmeetup.integration.suap: DEBUG
    feign: DEBUG
    org.apache.http: DEBUG
    feign.Retryer: DEBUG
